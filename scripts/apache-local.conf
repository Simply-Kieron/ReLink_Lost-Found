ServerRoot "C:/wamp/bin/apache/apache2.4.54.2"
Listen 127.0.0.1:8085
ServerName localhost:8085
PidFile "@PROJECT_ROOT@/.relink-runtime/httpd.pid"
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule alias_module modules/mod_alias.so
LoadModule php_module "C:/wamp/bin/php/php8.0.26/php8apache2_4.dll"
PHPIniDir "C:/wamp/bin/apache/apache2.4.54.2/bin"
DocumentRoot "@PROJECT_ROOT@"
DirectoryIndex index.php
TypesConfig conf/mime.types
AddType application/x-httpd-php .php
ErrorLog "@PROJECT_ROOT@/.relink-runtime/apache-error.log"
LogLevel warn
<Directory />
    AllowOverride None
    Require all denied
</Directory>
<Directory "@PROJECT_ROOT@">
    Options -Indexes
    AllowOverride All
    Require local
    php_value session.name RELINKMAIN
    php_value session.save_path "@PROJECT_ROOT@/.relink-runtime/sessions"
</Directory>
<Directory "@PROJECT_ROOT@/.git">
    Require all denied
</Directory>
<Directory "@PROJECT_ROOT@/.relink-runtime">
    Require all denied
</Directory>
<Directory "@PROJECT_ROOT@/node_modules">
    Require all denied
</Directory>
<DirectoryMatch "/(_phase5_backup_[^/]+|_config_backup_[^/]+)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "(^\.|\.(bak|sql|ini|log|json|md|ps1|cmd|conf)$)">
    Require all denied
</FilesMatch>
RedirectMatch ^/$ /public/index.php